<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'"
    />
    <title>Nikki</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="cat.css" />
  </head>
  <body data-state="idle" data-view="home">
    <div id="island" class="hit boot" data-mood="awake">
      <!-- closed: only Nikki's eyes and whiskers at the edge; what happens shows as the light edge (#glow) -->
      <button id="notch" type="button" aria-expanded="false" aria-controls="panel" aria-label="Nikki öffnen">
        <svg class="wh whL" viewBox="0 0 34 20" aria-hidden="true">
          <defs>
            <linearGradient id="wgL" gradientUnits="userSpaceOnUse" x1="34" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f4f2" stop-opacity="0.9" /><stop offset="1" stop-color="#f4f4f2" stop-opacity="0.2" /></linearGradient>
          </defs>
          <g stroke="url(#wgL)"><path d="M34 8 Q19 6.5 1 2" /><path d="M34 10 Q19 10 1 10" /><path d="M34 12 Q19 13.5 1 18" /></g>
        </svg>
        <svg class="wh whR" viewBox="0 0 34 20" aria-hidden="true">
          <defs>
            <linearGradient id="wgR" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="33" y2="0"><stop offset="0" stop-color="#f4f4f2" stop-opacity="0.9" /><stop offset="1" stop-color="#f4f4f2" stop-opacity="0.2" /></linearGradient>
          </defs>
          <g stroke="url(#wgR)"><path d="M0 8 Q15 6.5 33 2" /><path d="M0 10 Q15 10 33 10" /><path d="M0 12 Q15 13.5 33 18" /></g>
        </svg>
        <svg id="eyes" viewBox="0 0 44 36" aria-hidden="true">
          <g class="eOval"><rect x="12" y="13" width="6" height="9" rx="3" /><rect x="26" y="13" width="6" height="9" rx="3" /></g>
          <g class="eNeed"><circle cx="15" cy="17" r="4.2" /><circle cx="29" cy="17" r="4.2" /><circle class="glint" cx="16.4" cy="15.6" r="1.1" /><circle class="glint" cx="30.4" cy="15.6" r="1.1" /></g>
          <g class="eHappy"><path d="M11 19 Q15 13 19 19" /><path d="M25 19 Q29 13 33 19" /></g>
          <g class="eSleep"><path d="M11 17 Q15 20.5 19 17" /><path d="M25 17 Q29 20.5 33 17" /><text x="36" y="13">z</text><text x="36" y="13">z</text></g>
        </svg>
      </button>

      <!-- open: the island; its height follows #panelBox -->
      <div id="panel">
        <div class="shimmer" aria-hidden="true"><span></span><span></span></div><!-- soft neutral light behind the glass of Home -->
        <div id="panelBox">
          <nav id="tabs" aria-label="Ansichten">
            <button type="button" class="tab" data-view="home" aria-pressed="true" aria-label="Heute" title="Heute">
              <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
            </button>
            <button type="button" class="tab" data-view="chat" aria-pressed="false" aria-label="Chat" title="Chat">
              <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.2-4.4A8 8 0 1 1 21 12z" /></svg>
              <span id="chatDot" class="tabDot" hidden></span>
            </button>
            <div id="moduleTabs"></div><!-- tabs of the modules switched on (app.js) -->
            <span class="grow"></span>
            <button id="openSettings" type="button" class="tab" aria-label="Einstellungen" title="Einstellungen">
              <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
            </button>
          </nav>

          <section id="viewHome" class="view">
            <!-- four glass tiles (canvas Glas): Claude, Musik, Wetter, Kalender; music and calendar only while their module is on (app.js) -->
            <div class="tiles" id="homeTiles">
              <div class="tile" data-tile="claude">
                <div class="tileHead"><svg class="hi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4" /></svg>Claude<span id="claudeMeta"></span></div>
                <div id="claudeSessions" class="tileList"></div>
                <button id="toChat" type="button" class="glassBtn">Zum Chat</button>
              </div>
              <div class="tile weather" data-tile="weather" id="weatherTile"></div>
            </div>
          </section>

          <section id="viewChat" class="view" hidden>
            <div class="chatHead">
              <div class="projectWrap">
                <button id="projectBtn" type="button" class="chip" aria-pressed="true" aria-haspopup="menu" aria-expanded="false">
                  <span id="ownDot" class="sDot"></span><span id="projectName">Projekt wählen</span>
                  <svg class="icon chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" /></svg>
                </button>
                <div id="projectMenu" class="menu" role="menu" hidden></div>
              </div>
              <div id="sessionPills" role="group" aria-label="Terminal-Sessions" hidden></div>
              <span class="grow"></span>
              <span id="branch" class="branch" hidden>
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.7" /><circle cx="4.5" cy="12.5" r="1.7" /><circle cx="11.5" cy="5" r="1.7" /><path d="M4.5 5.2v5.6M11.5 6.7c0 3-3.6 2.4-6.4 4.4" /></svg>
                <span id="branchName"></span>
              </span>
              <div class="chatsWrap">
                <button id="chatsBtn" class="chip" type="button" title="Chat wählen" aria-label="Chat wählen" aria-haspopup="menu" aria-expanded="false">
                  <span id="chatName">Neuer Chat</span>
                  <svg class="icon chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" /></svg>
                </button>
                <div id="chatsMenu" class="menu chatsMenu" role="menu" hidden></div>
              </div>
              <button id="planBtn" class="iconBtn" type="button" aria-pressed="false" title="Erst planen" aria-label="Erst planen">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h1.5M3 8h1.5M3 11.5h1.5M7 4.5h6M7 8h6M7 11.5h6" /></svg>
              </button>
              <button id="newBtn" class="iconBtn" type="button" aria-pressed="false" title="Neue Session" aria-label="Neue Session">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
              </button>
              <div class="modelWrap">
                <button id="modelBtn" class="chip on" type="button" title="Modell wählen" aria-haspopup="menu" aria-expanded="false">
                  <span id="modelName">Standard</span>
                </button>
                <div id="modelMenu" class="menu" role="menu" hidden></div>
              </div>
            </div>
            <div class="chatCard">
              <div id="output">
                <div id="thread" aria-label="Konversation"></div>
                <div id="answer" aria-live="polite"></div>
                <div id="termReply" aria-live="polite" hidden></div><!-- a pinned terminal session: its last answer instead of our chat -->
                <div id="permission" role="group" aria-labelledby="permTitle" tabindex="-1" hidden>
                  <p id="permTitle"></p>
                  <div id="permBody"></div>
                  <div id="permActions" class="actions"></div>
                </div>
              </div>
              <p id="stepLine" class="stepLine" aria-live="polite" data-empty="true">Nikki wartet…</p>
            </div>
            <form id="composer">
              <textarea id="prompt" rows="1" placeholder="Was soll Claude tun?" aria-label="Aufgabe"></textarea>
              <button id="go" type="submit" aria-label="Senden">
                <svg class="icon send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" /></svg>
                <svg class="icon stopIcon" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5" /></svg>
              </button>
            </form>
          </section>
        </div>
      </div>
    </div>

    <!-- glow (canvas Glow, in its coordinates: screen 1264 wide, notch at 577–687, lower corners r 18): a light edge along the notch
         that runs out as a hairline along the top of the screen, a reflex travelling along it, the spectrum growing down out of the notch.
         Behind the island, never catches the mouse. data-glow: need | work | done | error | music | voice | '' (app.js) -->
    <div id="glowClip">
    <svg id="glow" data-glow="" data-level="normal" viewBox="-4368 0 10000 120" aria-hidden="true">
      <defs>
        <linearGradient id="rimFade" gradientUnits="userSpaceOnUse" x1="-4368" y1="0" x2="5632" y2="0">
          <stop offset="0" stop-opacity="0.3" /><stop offset="0.4" stop-opacity="0.5" /><stop offset="0.44" stop-opacity="0.65" /><stop offset="0.49" stop-opacity="0.9" /><stop class="hot" offset="0.5" stop-opacity="1" />
          <stop offset="0.51" stop-opacity="0.9" /><stop offset="0.56" stop-opacity="0.65" /><stop offset="0.6" stop-opacity="0.5" /><stop offset="1" stop-opacity="0.3" />
        </linearGradient>
        <linearGradient id="barFade" x1="0" y1="0" x2="0" y2="1"><stop class="hot" offset="0" stop-opacity="1" /><stop offset="0.35" stop-opacity="0.95" /><stop offset="1" stop-opacity="0.08" /></linearGradient>
        <filter id="soft" x="-5%" y="-200%" width="110%" height="500%"><feGaussianBlur stdDeviation="2.4" /></filter>
        <filter id="softer" x="-5%" y="-200%" width="110%" height="500%"><feGaussianBlur stdDeviation="5" /></filter>
      </defs>
      <g class="rim" fill="none" stroke="url(#rimFade)" stroke-linejoin="round">
        <path class="rimOuter" d="M -4368 1 L 577 1 L 577 18 A 18 18 0 0 0 595 37 L 669 37 A 18 18 0 0 0 687 18 L 687 1 L 5632 1" stroke-width="7" filter="url(#softer)" opacity="0.55" />
        <path class="rimSoft" d="M -4368 1 L 577 1 L 577 18 A 18 18 0 0 0 595 37 L 669 37 A 18 18 0 0 0 687 18 L 687 1 L 5632 1" stroke-width="3" filter="url(#soft)" />
        <path d="M -4368 1 L 577 1 L 577 18 A 18 18 0 0 0 595 37 L 669 37 A 18 18 0 0 0 687 18 L 687 1 L 5632 1" stroke-width="1.2" />
      </g>
      <path class="sweep" d="M 0 1 L 577 1 L 577 18 A 18 18 0 0 0 595 37 L 669 37 A 18 18 0 0 0 687 18 L 687 1 L 1264 1" pathLength="1000" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="60 1000" stroke-dashoffset="1060" filter="url(#soft)" />
      <g class="bars"><use href="#specBars" filter="url(#soft)" opacity="0.55" /><g id="specBars" fill="url(#barFade)"></g></g>
    </svg>
    </div>
    <!-- her head behind the closed notch (createNotchPeek in cat.js) -->
    <div id="notchPeek" aria-hidden="true"></div>

    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <script src="../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="markdown-text.js"></script>
    <script src="glance.js"></script>
    <script src="sound.js"></script>
    <script src="cat.js"></script>
    <script src="intro.js"></script>
    <script src="spectrum.js"></script>
    <script src="modules.js"></script>
    <script src="modules/music.js"></script>
    <script src="modules/calendar.js"></script>
    <script src="modules/shelf.js"></script>
    <script src="modules/todo.js"></script>
    <script src="modules/notes.js"></script>
    <script src="modules/timer.js"></script>
    <script src="modules/clipboard.js"></script>
    <script src="app.js"></script>
  </body>
</html>
