<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'"
    />
    <title>Nikki</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-state="idle" data-view="home">
    <div id="island" class="hit">
      <div id="bar">
        <nav id="nav" aria-label="Ansichten">
          <button type="button" class="navBtn" data-view="home" aria-pressed="true" title="Home" aria-label="Home">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 2.5l5.5 5M4 7v5.5h3V9.5h2V12.5h3V7" /></svg>
          </button>
          <button type="button" class="navBtn" data-view="chat" aria-pressed="false" title="Chat" aria-label="Chat">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10v7H7l-2.5 2v-2H3z" /></svg>
          </button>
        </nav>
        <div id="stage">
          <div id="walker" aria-hidden="true">
            <div id="sizer" class="sizer">
            <div id="face" class="face">
              <svg id="cat" class="cat" viewBox="0 0 64 56">
                <g class="all">
                  <g class="leg lb2 far"><rect x="22" y="43" width="6" height="11" rx="3" /></g>
                  <g class="leg lf2 far"><rect x="36" y="43" width="6" height="11" rx="3" /></g>
                  <g class="tail"><g class="sway"><path class="tailfur" d="M15 40 C8 38 5.5 31 7.5 24" /><circle class="tailtip" cx="7.6" cy="24.4" r="3" /></g></g>
                  <g class="torso">
                    <ellipse class="fur" cx="26" cy="41" rx="13" ry="8.5" />
                    <ellipse class="spot" cx="22" cy="37.5" rx="6" ry="4.2" />
                  </g>
                  <g class="leg lb1"><rect x="16" y="43" width="6.2" height="11" rx="3.1" /></g>
                  <g class="leg lf1"><rect x="30" y="43" width="6.2" height="11" rx="3.1" /></g>
                  <g class="head">
                    <g class="earB"><path class="fur" d="M29.5 21 L31 4.5 L40.5 12.5 Z" /><path class="inner" d="M32.4 17.5 L33.1 9.6 L37.8 13.4 Z" /></g>
                    <g class="earF"><path class="fur" d="M44.5 11.5 L54 4 L56.5 20 Z" /><path class="inner" d="M47.6 12.4 L52.4 8.6 L53.6 16.6 Z" /></g>
                    <ellipse class="fur" cx="42" cy="27" rx="15" ry="13" />
                    <ellipse class="spot" cx="33.5" cy="19.5" rx="5.2" ry="4.2" />
                    <ellipse class="cheek" cx="33.5" cy="32" rx="2.8" ry="1.7" />
                    <ellipse class="cheek" cx="50.5" cy="32" rx="2.8" ry="1.7" />
                    <g class="eyes">
                      <g class="look">
                        <ellipse class="eye" cx="37" cy="27" rx="3.1" ry="3.9" />
                        <ellipse class="eye" cx="47" cy="27" rx="3.1" ry="3.9" />
                        <circle class="glint" cx="38.1" cy="25.5" r="1.3" />
                        <circle class="glint" cx="48.1" cy="25.5" r="1.3" />
                      </g>
                    </g>
                    <g class="ex exHappy"><path d="M33.8 28.3 Q37 24 40.2 28.3" /><path d="M43.8 28.3 Q47 24 50.2 28.3" /></g>
                    <g class="ex exClosed"><path d="M33.8 27.2 Q37 30 40.2 27.2" /><path d="M43.8 27.2 Q47 30 50.2 27.2" /></g>
                    <g class="ex exSquint"><path d="M34.2 24.5 L39.6 27.2 L34.2 29.9" /><path d="M49.8 24.5 L44.4 27.2 L49.8 29.9" /></g>
                    <g class="ex exDizzy">
                      <path class="spiral" d="M37 27 m-3.2 0 a3.2 3.2 0 1 1 6.4 0 a2.2 2.2 0 1 1 -4.4 0 a1.2 1.2 0 1 1 2.4 0" />
                      <path class="spiral" d="M47 27 m-3.2 0 a3.2 3.2 0 1 1 6.4 0 a2.2 2.2 0 1 1 -4.4 0 a1.2 1.2 0 1 1 2.4 0" />
                    </g>
                    <path class="nose" d="M40.4 31.3 h3.2 l-1.6 1.8 z" />
                    <path class="mouth" d="M42 33.1 q-1.6 1.8 -3.2 .7 M42 33.1 q1.6 1.8 3.2 .7" />
                    <ellipse class="mouthO" cx="42" cy="35" rx="1.7" ry="2" />
                    <ellipse class="yawn" cx="42" cy="35.4" rx="2.4" ry="3" />
                    <ellipse class="tongue" cx="42" cy="35.6" rx="1.4" ry="1.8" />
                    <path class="mouthSad" d="M39.6 35.8 Q42 33.8 44.4 35.8" />
                    <path class="whisker" d="M29.5 31 L25 30.2 M29.5 33.6 L25 34.4 M54.5 31 L59 30.2 M54.5 33.6 L59 34.4" />
                  </g>
                </g>
                <g class="bubble"><rect x="56" y="-5" width="12" height="12" rx="4.5" /><text x="62" y="4.2">!</text></g>
                <g class="zzz"><text x="57" y="7">z</text><text x="62.5" y="0">z</text></g>
              </svg>
            </div>
            </div>
          </div>
        </div>
        <button id="pill" type="button" aria-expanded="false" aria-controls="panel">
          <span id="dot"></span><span id="statusText">Nikki wartet…</span>
        </button>
        <div id="sessionPills" role="group" aria-label="Beobachtete Sessions" hidden></div>
        <span id="branch" class="chip" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.7" /><circle cx="4.5" cy="12.5" r="1.7" /><circle cx="11.5" cy="5" r="1.7" /><path d="M4.5 5.2v5.6M11.5 6.7c0 3-3.6 2.4-6.4 4.4" /></svg>
          <span id="branchName"></span>
        </span>
        <div id="barActions">
          <div class="chatsWrap">
            <button id="chatsBtn" class="chatsBtn" type="button" title="Chat wählen" aria-label="Chat wählen" aria-haspopup="menu" aria-expanded="false">
              <span id="chatName">Neuer Chat</span>
              <svg class="icon chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" /></svg>
            </button>
            <div id="chatsMenu" class="menu chatsMenu" role="menu" hidden></div>
          </div>
          <button id="muteBtn" class="iconBtn always" type="button" aria-pressed="false" title="Töne" aria-label="Töne">
            <svg class="icon muteOn" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6.5h2.2L8 4v8L5.2 9.5H3zM10 6.2c.9.7.9 2.9 0 3.6M11.8 4.8c1.7 1.4 1.7 5 0 6.4" /></svg>
            <svg class="icon muteOff" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6.5h2.2L8 4v8L5.2 9.5H3zM10.5 6l3 3M13.5 6l-3 3" /></svg>
          </button>
          <button id="planBtn" class="iconBtn" type="button" aria-pressed="false" title="Erst planen" aria-label="Erst planen">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h1.5M3 8h1.5M3 11.5h1.5M7 4.5h6M7 8h6M7 11.5h6" /></svg>
          </button>
          <button id="newBtn" class="iconBtn" type="button" aria-pressed="false" title="Neue Session" aria-label="Neue Session">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
          </button>
        </div>
      </div>

      <div id="panel">
        <section id="viewHome" class="view">
          <div class="card homeStatus">
            <div class="nikkiStage" id="homeStage" aria-label="Nikki">
              <div class="walker nikkiBlob" id="homeWalker"></div>
            </div>
            <div class="homeCopy">
              <p id="homeTitle" class="homeTitle"><span class="liveDot"></span><span id="homeTitleText">Claude</span></p>
              <p id="homeSub" class="meta">Nikki wartet… · Agent wählen.</p>
              <div class="projectWrap">
                <button id="projectBtn" type="button" aria-haspopup="menu" aria-expanded="false">
                  <span id="projectName">Projekt wählen</span>
                  <svg class="icon chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" /></svg>
                </button>
                <div id="projectMenu" class="menu" role="menu" hidden></div>
              </div>
              <p id="cardBranch" class="meta" hidden>
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.7" /><circle cx="4.5" cy="12.5" r="1.7" /><circle cx="11.5" cy="5" r="1.7" /><path d="M4.5 5.2v5.6M11.5 6.7c0 3-3.6 2.4-6.4 4.4" /></svg>
                <span id="cardBranchName"></span>
              </p>
            </div>
          </div>
          <div class="card homeAgents">
            <div id="agentGrid" role="listbox" aria-label="Agenten und Anbindungen"></div>
            <div id="integMenu" class="menu integMenu" role="menu" hidden></div>
            <div id="modelMenu" class="menu modelMenuHome" role="menu" hidden></div>
          </div>
        </section>

        <section id="viewChat" class="view" hidden>
          <div class="card side">
            <div class="nikkiStage chatNikki" id="chatStage" aria-label="Nikki">
              <div class="walker nikkiBlob" id="chatWalker"></div>
            </div>
            <div class="sideMeta">
              <p id="stepLine" class="meta stepLine" aria-live="polite">Nikki wartet…</p>
            </div>
          </div>
          <div class="card main chatMain">
            <div class="chatBody">
              <div id="output">
                <div id="permission" hidden>
                  <p id="permTitle"></p>
                  <div id="permBody"></div>
                  <div id="permActions" class="actions"></div>
                </div>
                <div id="thread" aria-label="Konversation"></div>
                <div id="answer" aria-live="polite"></div>
              </div>
              <form id="composer">
                <textarea id="prompt" rows="1" placeholder="Was soll ich tun?" aria-label="Aufgabe"></textarea>
                <button id="go" type="submit" aria-label="Senden">
                  <svg class="icon send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" /></svg>
                  <svg class="icon stopIcon" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5" /></svg>
                </button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <script src="../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="companion.js"></script>
    <script src="app.js"></script>
  </body>
</html>
