<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'"
    />
    <title>Nikki</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-state="idle" data-view="home">
    <div id="island" class="hit boot" data-mood="awake">
      <!-- closed: only Nikki's eyes, whiskers at the edge, one info per side when something happens -->
      <button id="notch" type="button" aria-expanded="false" aria-controls="panel" aria-label="Nikki öffnen">
        <svg class="wh whL" viewBox="0 0 34 20" aria-hidden="true">
          <defs>
            <linearGradient id="wgL" gradientUnits="userSpaceOnUse" x1="34" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f4f2" stop-opacity="0.9" /><stop offset="1" stop-color="#f4f4f2" stop-opacity="0.2" /></linearGradient>
          </defs>
          <g stroke="url(#wgL)"><path d="M34 8 Q19 6.5 1 2" /><path d="M34 10 Q19 10 1 10" /><path d="M34 12 Q19 13.5 1 18" /></g>
        </svg>
        <svg class="wh whR" viewBox="0 0 34 20" aria-hidden="true">
          <defs>
            <linearGradient id="wgR" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="33" y2="0"><stop offset="0" stop-color="#f4f4f2" stop-opacity="0.9" /><stop offset="1" stop-color="#f4f4f2" stop-opacity="0.2" /></linearGradient>
          </defs>
          <g stroke="url(#wgR)"><path d="M0 8 Q15 6.5 33 2" /><path d="M0 10 Q15 10 33 10" /><path d="M0 12 Q15 13.5 33 18" /></g>
        </svg>
        <span id="glanceL" class="side"></span>
        <svg id="eyes" viewBox="0 0 44 36" aria-hidden="true">
          <g class="eOval"><rect x="12" y="13" width="6" height="9" rx="3" /><rect x="26" y="13" width="6" height="9" rx="3" /></g>
          <g class="eNeed"><circle cx="15" cy="17" r="4.2" /><circle cx="29" cy="17" r="4.2" /><circle class="glint" cx="16.4" cy="15.6" r="1.1" /><circle class="glint" cx="30.4" cy="15.6" r="1.1" /></g>
          <g class="eHappy"><path d="M11 19 Q15 13 19 19" /><path d="M25 19 Q29 13 33 19" /></g>
          <g class="eSleep"><path d="M11 17 Q15 20.5 19 17" /><path d="M25 17 Q29 20.5 33 17" /><text x="36" y="13">z</text><text x="36" y="13">z</text></g>
        </svg>
        <span id="glanceR" class="side"></span>
      </button>

      <!-- open: the island; its height follows #panelBox -->
      <div id="panel">
        <div id="panelBox">
          <nav id="tabs" aria-label="Ansichten">
            <button type="button" class="tab" data-view="home" aria-pressed="true" aria-label="Heute" title="Heute">
              <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
            </button>
            <button type="button" class="tab" data-view="chat" aria-pressed="false" aria-label="Chat" title="Chat">
              <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.2-4.4A8 8 0 1 1 21 12z" /></svg>
              <span id="chatDot" class="tabDot" hidden></span>
            </button>
            <div id="moduleTabs"></div><!-- part 2: tabs of the modules that are switched on -->
            <span class="grow"></span>
            <button type="button" class="tab" data-view="settings" aria-pressed="false" aria-label="Einstellungen" title="Einstellungen">
              <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
            </button>
          </nav>

          <section id="viewHome" class="view">
            <div class="homeHead">
              <div class="nikkiStage" id="homeStage" aria-label="Nikki">
                <div class="walker nikkiBlob" id="homeWalker">
                  <div class="sizer">
                    <div class="face">
                      <svg class="cat" viewBox="0 0 64 56">
                        <g class="all">
                          <g class="leg lb2 far"><rect x="22" y="43" width="6" height="11" rx="3" /></g>
                          <g class="leg lf2 far"><rect x="36" y="43" width="6" height="11" rx="3" /></g>
                          <g class="tail"><g class="sway"><path class="tailfur" d="M15 40 C8 38 5.5 31 7.5 24" /><circle class="tailtip" cx="7.6" cy="24.4" r="3" /></g></g>
                          <g class="torso">
                            <ellipse class="fur" cx="26" cy="41" rx="13" ry="8.5" />
                            <ellipse class="spot" cx="22" cy="37.5" rx="6" ry="4.2" />
                          </g>
                          <g class="leg lb1"><rect x="16" y="43" width="6.2" height="11" rx="3.1" /></g>
                          <g class="leg lf1"><rect x="30" y="43" width="6.2" height="11" rx="3.1" /></g>
                          <g class="head">
                            <g class="earB"><path class="fur" d="M29.5 21 L31 4.5 L40.5 12.5 Z" /><path class="inner" d="M32.4 17.5 L33.1 9.6 L37.8 13.4 Z" /></g>
                            <g class="earF"><path class="fur" d="M44.5 11.5 L54 4 L56.5 20 Z" /><path class="inner" d="M47.6 12.4 L52.4 8.6 L53.6 16.6 Z" /></g>
                            <ellipse class="fur" cx="42" cy="27" rx="15" ry="13" />
                            <ellipse class="spot" cx="33.5" cy="19.5" rx="5.2" ry="4.2" />
                            <ellipse class="cheek" cx="33.5" cy="32" rx="2.8" ry="1.7" />
                            <ellipse class="cheek" cx="50.5" cy="32" rx="2.8" ry="1.7" />
                            <g class="eyes">
                              <g class="look">
                                <ellipse class="eye" cx="37" cy="27" rx="3.1" ry="3.9" />
                                <ellipse class="eye" cx="47" cy="27" rx="3.1" ry="3.9" />
                                <circle class="glint" cx="38.1" cy="25.5" r="1.3" />
                                <circle class="glint" cx="48.1" cy="25.5" r="1.3" />
                              </g>
                            </g>
                            <g class="ex exHappy"><path d="M33.8 28.3 Q37 24 40.2 28.3" /><path d="M43.8 28.3 Q47 24 50.2 28.3" /></g>
                            <g class="ex exClosed"><path d="M33.8 27.2 Q37 30 40.2 27.2" /><path d="M43.8 27.2 Q47 30 50.2 27.2" /></g>
                            <g class="ex exSquint"><path d="M34.2 24.5 L39.6 27.2 L34.2 29.9" /><path d="M49.8 24.5 L44.4 27.2 L49.8 29.9" /></g>
                            <g class="ex exDizzy">
                              <path class="spiral" d="M37 27 m-3.2 0 a3.2 3.2 0 1 1 6.4 0 a2.2 2.2 0 1 1 -4.4 0 a1.2 1.2 0 1 1 2.4 0" />
                              <path class="spiral" d="M47 27 m-3.2 0 a3.2 3.2 0 1 1 6.4 0 a2.2 2.2 0 1 1 -4.4 0 a1.2 1.2 0 1 1 2.4 0" />
                            </g>
                            <path class="nose" d="M40.4 31.3 h3.2 l-1.6 1.8 z" />
                            <path class="mouth" d="M42 33.1 q-1.6 1.8 -3.2 .7 M42 33.1 q1.6 1.8 3.2 .7" />
                            <ellipse class="mouthO" cx="42" cy="35" rx="1.7" ry="2" />
                            <ellipse class="yawn" cx="42" cy="35.4" rx="2.4" ry="3" />
                            <ellipse class="tongue" cx="42" cy="35.6" rx="1.4" ry="1.8" />
                            <path class="mouthSad" d="M39.6 35.8 Q42 33.8 44.4 35.8" />
                            <path class="whisker" d="M29.5 31 L25 30.2 M29.5 33.6 L25 34.4 M54.5 31 L59 30.2 M54.5 33.6 L59 34.4" />
                          </g>
                        </g>
                        <g class="bubble"><rect x="56" y="-5" width="12" height="12" rx="4.5" /><text x="62" y="4.2">!</text></g>
                        <g class="zzz"><text x="57" y="14">z</text><text x="62.5" y="8">z</text></g>
                      </svg>
                    </div>
                  </div>
                </div>
              </div>
              <div class="greet"><strong id="greet">Hallo</strong><span id="today"></span></div>
            </div>
            <div class="tiles">
              <div class="tile">
                <div class="tileHead">Claude<span id="claudeMeta"></span></div>
                <div id="claudeSessions" class="tileList"></div>
                <button id="toChat" type="button" class="btn">Zum Chat</button>
              </div>
            </div>
          </section>

          <section id="viewChat" class="view" hidden>
            <div class="chatHead">
              <div class="projectWrap">
                <button id="projectBtn" type="button" class="chip" aria-pressed="true" aria-haspopup="menu" aria-expanded="false">
                  <span id="ownDot" class="sDot"></span><span id="projectName">Projekt wählen</span>
                  <svg class="icon chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" /></svg>
                </button>
                <div id="projectMenu" class="menu" role="menu" hidden></div>
              </div>
              <div id="sessionPills" role="group" aria-label="Terminal-Sessions" hidden></div>
              <span class="grow"></span>
              <span id="branch" class="branch" hidden>
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.7" /><circle cx="4.5" cy="12.5" r="1.7" /><circle cx="11.5" cy="5" r="1.7" /><path d="M4.5 5.2v5.6M11.5 6.7c0 3-3.6 2.4-6.4 4.4" /></svg>
                <span id="branchName"></span>
              </span>
              <div class="chatsWrap">
                <button id="chatsBtn" class="chip" type="button" title="Chat wählen" aria-label="Chat wählen" aria-haspopup="menu" aria-expanded="false">
                  <span id="chatName">Neuer Chat</span>
                  <svg class="icon chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" /></svg>
                </button>
                <div id="chatsMenu" class="menu chatsMenu" role="menu" hidden></div>
              </div>
              <button id="planBtn" class="iconBtn" type="button" aria-pressed="false" title="Erst planen" aria-label="Erst planen">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h1.5M3 8h1.5M3 11.5h1.5M7 4.5h6M7 8h6M7 11.5h6" /></svg>
              </button>
              <button id="newBtn" class="iconBtn" type="button" aria-pressed="false" title="Neue Session" aria-label="Neue Session">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
              </button>
              <div class="modelWrap">
                <button id="modelBtn" class="chip on" type="button" title="Modell wählen" aria-haspopup="menu" aria-expanded="false">
                  <span id="modelName">Standard</span>
                </button>
                <div id="modelMenu" class="menu" role="menu" hidden></div>
              </div>
            </div>
            <div class="chatCard">
              <div id="output">
                <div id="thread" aria-label="Konversation"></div>
                <div id="answer" aria-live="polite"></div>
                <div id="permission" hidden>
                  <p id="permTitle"></p>
                  <div id="permBody"></div>
                  <div id="permActions" class="actions"></div>
                </div>
              </div>
              <p id="stepLine" class="stepLine" aria-live="polite" data-empty="true">Nikki wartet…</p>
            </div>
            <form id="composer">
              <textarea id="prompt" rows="1" placeholder="Was soll Claude tun?" aria-label="Aufgabe"></textarea>
              <button id="go" type="submit" aria-label="Senden">
                <svg class="icon send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" /></svg>
                <svg class="icon stopIcon" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5" /></svg>
              </button>
            </form>
          </section>

          <section id="viewSettings" class="view" hidden>
            <div class="setCols">
              <div class="setCol">
                <section class="setCard" aria-labelledby="setGeneral">
                  <h2 id="setGeneral">Allgemein</h2>
                  <label class="setRow"><span>Mit Windows starten<small id="autostartHint" hidden>nur in der installierten App</small></span><input id="setAutostart" class="switch" type="checkbox" role="switch" /></label>
                  <div class="setRow">
                    <span>Tastenkürzel<small id="hotkeyMsg" role="status"></small></span>
                    <button id="setHotkey" type="button" class="btn mono" aria-pressed="false" title="Klicken, dann die neue Kombination drücken"></button>
                  </div>
                  <label class="setRow"><span>Töne</span><input id="setSound" class="switch" type="checkbox" role="switch" /></label>
                  <label class="setRow"><span>Einschlafen nach<small>ohne Aktivität, in Minuten</small></span><input id="setSleep" class="num" type="number" min="1" max="120" step="1" /></label>
                </section>
                <section class="setCard" aria-labelledby="setModules">
                  <h2 id="setModules">Module</h2>
                  <p class="setNote">Bald schaltest du hier Musik, Kalender, Ablage, To-do, Notizen und Timer ein und aus.</p>
                </section>
              </div>
              <div class="setCol">
                <section class="setCard" aria-labelledby="setClaude">
                  <h2 id="setClaude">Claude</h2>
                  <label class="setRow"><span>Terminal-Sessions beobachten<small>trägt Nikkis Hooks in ~/.claude/settings.json ein</small></span><input id="setHooks" class="switch" type="checkbox" role="switch" /></label>
                  <div class="setRow"><span>Claude-Pfad<small id="setClaudePath" class="mono"></small></span></div>
                </section>
                <section class="setCard" aria-labelledby="setGit">
                  <h2 id="setGit">Git/GitHub</h2>
                  <label class="setRow"><span>Branch im Chat zeigen</span><input id="setBranch" class="switch" type="checkbox" role="switch" /></label>
                </section>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <script src="../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="markdown-text.js"></script>
    <script src="glance.js"></script>
    <script src="hotkey.js"></script>
    <script src="companion.js"></script>
    <script src="app.js"></script>
  </body>
</html>
